<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login Account</title>
    <link rel="stylesheet" href="style.css">
	<!-- Smartsupp Live Chat script -->
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = '8038c0fbc1e30bb63bd04ffc3d2e1081bc26a7b5';
window.smartsupp||(function(d) {
  var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
  s=d.getElementsByTagName('script')[0];c=d.createElement('script');
  c.type='text/javascript';c.charset='utf-8';c.async=true;
  c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);

</head>
<body>

<div class="container">
    <div class="login-box">
        <h1>Login Now</h1>
        <p class="notice">
            Enter User and Password.
        </p>

        <form id="loginForm">
            <input type="text" placeholder="Username / Email" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div id="loading" class="hidden">
            Logging account...
        </div>

        <div id="errorMessage" class="hidden">
            <strong>Access Restricted</strong><br><br>
            Access Restricted<br>
            Security verification failed.<br>
            Please contact Chat support to restore account access.
        </div>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    document.getElementById("loginForm").style.display = "none";
    document.getElementById("loading").classList.remove("hidden");

    setTimeout(() => {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("errorMessage").classList.remove("hidden");
    }, 3000);
});
</script>

</body>
</html>
